[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdfs-anomaly"
version = "0.2.0"
description = "Pipeline MLOps para detección de anomalías en trazas de bloques HDFS"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy", "pandas", "scikit-learn"]

[project.scripts]
hdfs-data = "hdfs_anomaly.data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py314"
